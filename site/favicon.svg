<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Mark: three ascending dots on a diagonal, joined by a line - the same
    dot-plot-with-confidence-interval shape used throughout the dashboard's
    own charts (outcomes, regional comparison, aspirations), rather than a
    generic bar-chart/beaker/atom icon. Solid brand-teal background (not
    transparent) so it reads the same on light and dark browser chrome -
    contrast doesn't depend on the tab bar colour.
    Colours match the brand-primary and text-inverse tokens in site/css/tokens.css.
  -->
  <rect width="32" height="32" rx="7" fill="#0B7161"/>
  <polyline points="9,23 16,16 23,9" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="9" cy="23" r="2.75" fill="#FFFFFF"/>
  <circle cx="16" cy="16" r="2.75" fill="#FFFFFF"/>
  <circle cx="23" cy="9" r="2.75" fill="#FFFFFF"/>
</svg>
